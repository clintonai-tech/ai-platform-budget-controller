[project]
name = "budget-controller"
version = "0.1.0"
description = "Tiered LLM budget enforcement controller for AI platform governance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
]

[project.scripts]
budget-controller = "budget_controller.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

